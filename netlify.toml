[build]
  # The web app is one workspace in a monorepo; everything below is relative
  # to this base, so Netlify needs no dashboard configuration to find it.
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

# The card catalog snapshot (scripts/generateCatalog.js). Its filename contains a
# hash of its contents, so a given URL can never change and the browser never has
# to revalidate it — new prices simply produce a new filename. This is what makes
# the catalog a single edge-served request instead of ~17 uncacheable ones
# against Supabase.
[[headers]]
  for = "/catalog/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shared trade links (/?trade=…) unfurl with the trade's cards and totals in
# Discord, iMessage and Facebook: netlify/edge-functions/trade-meta.js rewrites
# the SPA's <head> for those URLs, and netlify/functions/trade-image.mjs draws
# the og:image at /og/trade.png. resvg ships a native binary, so it is left
# out of the bundle and installed alongside the function instead.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]

[build.environment]
  NODE_VERSION = "18"
  # Tell Netlify to ignore these environment variables in secret scanning
  # These are Supabase public keys that are safe to expose in client-side code
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Which Supabase project a deploy talks to is decided here, per context, rather
# than in code, and the app throws if it is not told. Nothing is secret: these are
# publishable keys, gated by RLS.

[context.production.environment]
  VITE_APP_ENV = "production"
  VITE_SUPABASE_URL = "https://tenrvaghaspwdvnwvgrh.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_ohMvMDesyA2rr4Y4nfALpg_i0N-swkr"

# Previews talk to staging (fabloodle) so they cannot read or write production
# user data. Web still cannot sell Pro — purchases live in the apps — but trade
# history and any future signed-in features stay off the production project.
# See docs/ENVIRONMENTS.md.

[context.deploy-preview.environment]
  VITE_APP_ENV = "staging"
  VITE_SUPABASE_URL = "https://cnmxaccamqshgvesieez.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_4hW7qDSTmCljfKl-dB43kQ_xSk0JFom"

[context.branch-deploy.environment]
  VITE_APP_ENV = "staging"
  VITE_SUPABASE_URL = "https://cnmxaccamqshgvesieez.supabase.co"
