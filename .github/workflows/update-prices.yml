name: Update FAB Prices

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: services/price-pipeline
        run: npm ci

      - name: Run ingest
        working-directory: services/price-pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ingest

      # Rebuild so the next visit can use the fast catalog snapshot. The site also
      # compares that file to fab_card_prices.updated_at and reads the database
      # when the pipeline is newer, so a skipped hook does not leave prices stale.
      # Skipped when the hook secret is unset, which is what a fork looks like.
      - name: Trigger website rebuild
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK is not set; skipping the site rebuild."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "Requested a Netlify rebuild so the new prices ship to the site."
